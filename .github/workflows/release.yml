name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - name: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    env:
      # Apple Silicon requires macOS 11 or newer.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.name == 'macos-arm64' && '11.0' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            libclang-dev \
            patchelf \
            xdg-utils

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows dependencies (x64)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          # Install libclang (LLVM)
          $llvmVersion = "18.1.8"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/clang+llvm-$llvmVersion-x86_64-pc-windows-msvc.tar.xz"
          Invoke-WebRequest -Uri $llvmUrl -OutFile "llvm.tar.xz"
          7z x llvm.tar.xz
          7z x llvm.tar
          $llvmDir = "clang+llvm-$llvmVersion-x86_64-pc-windows-msvc"
          echo "LIBCLANG_PATH=$pwd\$llvmDir\lib" >> $env:GITHUB_ENV

          # Install NASM
          $nasmVersion = "2.16.03"
          $nasmUrl = "https://www.nasm.us/pub/nasm/releasebuilds/$nasmVersion/win64/nasm-$nasmVersion-win64.zip"
          Invoke-WebRequest -Uri $nasmUrl -OutFile "nasm.zip"
          Expand-Archive -Path "nasm.zip" -DestinationPath "."
          $nasmDir = "nasm-$nasmVersion"
          echo "$pwd\$nasmDir" >> $env:GITHUB_PATH

      - name: Install Windows dependencies (arm64)
        if: matrix.name == 'windows-arm64'
        shell: pwsh
        run: |
          # Install libclang (LLVM)
          $llvmVersion = "22.1.8"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/clang+llvm-$llvmVersion-aarch64-pc-windows-msvc.tar.xz"
          Invoke-WebRequest -Uri $llvmUrl -OutFile "llvm.tar.xz"
          7z x llvm.tar.xz
          7z x llvm.tar
          $llvmDir = "clang+llvm-$llvmVersion-aarch64-pc-windows-msvc"
          echo "LIBCLANG_PATH=$pwd\$llvmDir\lib" >> $env:GITHUB_ENV

          # Install NASM
          $nasmVersion = "2.16.03"
          $nasmUrl = "https://www.nasm.us/pub/nasm/releasebuilds/$nasmVersion/win64/nasm-$nasmVersion-win64.zip"
          Invoke-WebRequest -Uri $nasmUrl -OutFile "nasm.zip"
          Expand-Archive -Path "nasm.zip" -DestinationPath "."
          $nasmDir = "nasm-$nasmVersion"
          echo "$pwd\$nasmDir" >> $env:GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release packages
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: |
          for file in \
            */*.deb \
            */*.rpm \
            */*.AppImage \
            */*.dmg \
            */*.msi \
            */*.exe; do
            [ -f "$file" ] && sha256sum "$file"
          done > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SVNexus ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**
