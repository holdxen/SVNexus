[env]
TS_RS_EXPORT_DIR = { value = "../src/bindings", relative = true }
TS_RS_LARGE_INT = "number"


LOONGARCH64_UNKNOWN_LINUX_GNU_OPENSSL_DIR = { value = "deps/linux-loongarch64/svn", relative = true, force = true }

