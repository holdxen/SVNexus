AARCH64_PC_WINDOWS_MSVC_OPENSSL_DIR = { value = "deps/win-aarch64/svn", relative = true, force = true }

AARCH64_APPLE_DARWIN_OPENSSL_DIR = { value = "deps/macos-aarch64/svn", relative = true, force = true }

