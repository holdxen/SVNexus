[package]
name = "svnexus"
version = "0.1.2"
description = "A modern Subversion client built with Tauri"
authors = ["holdxen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "svnexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
bindgen = "0.72.1"
cc = "1.2.63"
cfg-if = "1.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
walkdir = "2.5.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0", features = ["serde-json-impl"] }

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "tracing-log"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
chrono = "0.4.40"
derive-new = "0.7.0"
#num_enum = "0.7.3"
parking_lot = "0.12.3"
snafu = { version = "0.8.5", features = ["backtrace"] }
strum = { version = "0.27.1", features = ["derive"] }
tokio-stream = { version = "0.1.17", features = ["io-util", "sync"] }
#uuid = { version = "1.15.1", features = ["v4"] }
bitflags = "2.9.0"
once_cell = { version = "1.21.3", features = ["parking_lot"] }
tempfile = "3.23.0"
easy-ext = "1.0.2"
cfg-if = "1.0.0"
svnexus_macro = { path = "./svnexus_macro" }
walkdir = "2.5.0"
humansize = "2.1.3"
log = "0.4.29"
which = "8.0.2"
directories = "6.0.0"
ignore = "0.4.25"
tracing-appender = "0.2.5"
derive_more = "2.1.1"
flatline = { git = "https://github.com/holdxen/flatline.git", features = [] }
tauri-plugin-dialog = "2"
#dashmap = "6.2.1"
camino = "1.2.4"
rmp-serde = "1.3.0"
#rmpv = { version = "1.3.0", features = ["with-serde"] }
serde_bytes = "0.11.19"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
surrealdb = { version = "3.2.4", default-features = false, features = ["kv-surrealkv"] }
# tauri-plugin = "2.6.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
